# Dependency updates for podbox.
#
# ⛔ THIS FILE EXISTS BECAUSE ITS ABSENCE WAS A REAL DEFECT. The workflows here
# pin every action to a commit, which is the right practice and also turns an
# unattended pin into a fossil when an action changes its runtime. Pinning
# without an updater is not hardening, it is deferral.
#
# ⭐ Dependabot rewrites each pinned SHA and version comment together, so the
# two cannot drift apart.

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      # ⚠ Weekly, not daily. A daily cadence on a repository this size produces
      # more pull requests than anyone reads, and unread updates are worse than
      # none: they train you to merge without looking.
      interval: weekly
    groups:
      # ⛔ Ungrouped, one action bump becomes one pull request each, and each
      # costs a full CI run.
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3
    commit-message:
      # ⛔ No tool attribution anywhere in this repository's history.
      # docs/conventions/git.md.
      prefix: ci
    labels:
      - dependencies

  # ⛔ THE CORPUS IS EVIDENCE AND IT IS NEVER UPDATED.
  #
  # `references/` holds thirty third-party trees, pinned at the commit each was
  # read at. `scripts/check-todo.py` asserts that every `path:line` cited in
  # `TODO/` still resolves inside them, so a bump moves a line under a citation
  # and turns a measured claim into a wrong one. `docs/methodology/references.md`
  # is the rule; `TODO/reference-map.md` carries the provenance.
  #
  # ⛔ FOUR PULL REQUESTS AGAINST THE CORPUS REACHED THIS REPOSITORY BEFORE THIS
  # FENCE EXISTED, on 2026-09-11, and none of them was a version update: they
  # were SECURITY updates, which no schedule and no limit here controls.
  #
  # ⚠ `open-pull-requests-limit: 0` DOES NOT STOP THEM. Read from GitHub's own
  # options reference on 2026-09-11: that option is marked "Version updates
  # only", and the page states that security update pull requests are not
  # subject to the limit and do not count toward it. `ignore` is marked
  # "Version updates" AND "Security updates", so `ignore` is the fence and the
  # limit is only there to stop the scheduled half as well.
  #
  # ⚠ A vulnerability reported inside `references/` is not a vulnerability in
  # anything podbox ships. Nothing here is built, linked or executed.
  - package-ecosystem: cargo
    directories:
      - "/references/**"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: gomod
    directories:
      - "/references/**"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: pip
    directories:
      - "/references/**"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: npm
    directories:
      - "/references/**"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

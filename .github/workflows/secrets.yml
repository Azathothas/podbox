# Credential scanning, and the only place in this repository that does it.
#
# ⛔ THIS REPLACES A REGEX SCANNER, NOT A CHECK. The retired script matched
# credential SHAPES and read scripts/dev-lane.sh:205,
# `export HOME="${LANE_HOME:-/home/toolkit}"`, as a home-path fingerprint: a
# lane runner's default, not a credential. A shape regex cannot tell a checksum
# from a key and this tree carries both by design, so narrowing its patterns was
# unpaid work that never ended. TODO/gate.md T-1603, operator decision
# 2026-10-02. docs/security/secrets.md is the contract this answers to.
#
# ⭐ IT SCANS THE WORKING TREE AND THE WHOLE HISTORY, because they answer
# different questions. The tree says what would be published next. The history
# says whether a value was ever readable, which the tree cannot undo and rotation
# alone does not repair.
#
# ⚠ ONE ACTION, AND IT IS checkout. TruffleHog is a BINARY, not a second
# action: a scanner action would run third-party code inside a workflow that
# holds a token, and the binary carries the same pin by SHA-256 instead.

name: secrets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: trufflehog, tree and history
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # ⛔ fetch-depth: 0 IS THE HISTORY SCAN, NOT AN OPTIMISATION. The git scan
      # below reads commits, and a shallow checkout has one of them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # ⛔ THE PIN IS A SHA-256, THE SAME SHAPE gate.yml's licence step uses, and
      # for the same reason: a version that moves under the workflow is a scan
      # whose result nobody chose. Read the sha256sum exit code, unpiped. This
      # value is the one the release's own published checksum file carries for
      # the linux_amd64 tarball of v3.97.9, and the comment states the version it
      # belongs to: raising VERSION without raising this line must go red here
      # rather than scan whatever that tag now publishes.
      - name: trufflehog, version and checksum pinned
        env:
          VERSION: 3.97.9
          PINNED_SHA256: 40377e6572495412fb9ba0bc21c9401f73b72f1d2afd11b9931bc4a5ed622866
        run: |
          asset="trufflehog_${VERSION}_linux_amd64.tar.gz"
          base="https://github.com/trufflesecurity/trufflehog/releases/download/v${VERSION}"
          curl -fsSLo "$asset" "${base}/${asset}"
          echo "$PINNED_SHA256  $asset" | sha256sum -c -
          mkdir -p dist
          tar -xzf "$asset" -C dist trufflehog
          install -m 0755 dist/trufflehog /usr/local/bin/trufflehog
          trufflehog --version

      # ⛔ --results=verified AND NOT unverified OR unknown, MEASURED, NOT
      # ASSUMED. The first run of this workflow on the landed commit,
      # 2026-10-02, scanned 34993 chunks and 375 MB in 19 s and reported
      # `verified_secrets: 0`, `unverified_secrets: 122`, and exited 183 on
      # every one of them. 119 of the 122 are Dockerhub detector hits on
      # documentation in the retained corpus and on captured GitHub issue
      # and comment JSON; 3 are URI hits. None is a credential.
      #
      # `unknown` was in the first scope and is why that run was red: a
      # Dockerhub verification answered HTTP 429, which trufflehog records as
      # unknown rather than unverified, so somebody else's rate limit is
      # indistinguishable here from a vendor-confirmed secret. Failing on
      # `unknown` fails on the upstream's rate limit. Failing on `unverified`
      # fails on 122 shapes that are this tree's own corpus of other people's
      # source, which is the deleted check's defect arriving in a new tool:
      # a scan that cries wolf is a scan somebody turns off.
      #
      # Verified is a credential a vendor confirmed against its own API, and
      # a verified result fails this job. ⚠ THAT IS A NARROWER SUBJECT THAN
      # THE FIRST SCOPE AND THE SCAN STILL RUNS OVER EVERYTHING; only the
      # set that turns the job red is narrower. The 122 known results are
      # 119 Dockerhub and 3 URI hits inside `references/`, so they disappear
      # with the corpus if T-1606 closes; a session that widens this scope
      # must say what moved, and the measured numbers above are what to
      # compare against.
      #
      # ⛔ --fail, AND ITS EXIT CODE IS 183, NOT 1. Without --fail a finding
      # exits 0 and this job is green over a credential. Read the code from
      # the process that produced it.
      - name: the working tree
        run: trufflehog filesystem . --results=verified --fail

      # ⭐ THE WHOLE HISTORY. file://. with no --since-commit: this repository
      # ships a value the tree no longer holds, and the question that matters is
      # when it was readable, not what is checked out now.
      - name: the whole history
        run: trufflehog git file://. --results=verified --fail

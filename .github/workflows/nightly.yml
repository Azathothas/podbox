name: nightly

# TODO/packaging.md T-1314. One tag builds and smoke-tests every supported arch.
#
# Nothing in gate.yml moves: that workflow answers pushes to main and pull
# requests, and this one answers version tags alone. Each run on a `v*` tag
# publishes a pre-release named nightly with the seven static binaries and
# their hashes beside it. Stable releases stay manual and are not designed
# here.
#
# TODO/packaging.md T-1671. release.yml starts this workflow: it creates the
# tag, then dispatches this workflow on the tag. A tag push no longer starts
# it. A run on the tag ref keeps the signing identity that podvm-verify
# requires, `nightly.yml@refs/tags/TAG`, and the run that podvm-publish reads
# (head branch TAG). A reusable workflow called from release.yml signs as
# the ref of the caller, `refs/heads/main`, so this file is not one. An
# operator can dispatch it on an existing tag to build that tag again.
#
# A tag that builds red publishes nothing: the publish job needs every matrix
# leg, so one red arch skips the release instead of shipping six binaries.

on:
  workflow_dispatch:
    inputs:
      trial:
        description: "Build, smoke and package each arch on a branch, and publish nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and smoke ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            triple: x86_64-unknown-linux-musl
            qemu: ""
          - arch: aarch64
            triple: aarch64-unknown-linux-musl
            qemu: qemu-aarch64-static
          - arch: riscv64gc
            triple: riscv64gc-unknown-linux-musl
            qemu: qemu-riscv64-static
          - arch: loongarch64
            triple: loongarch64-unknown-linux-musl
            qemu: qemu-loongarch64-static
          - arch: armv7
            triple: armv7-unknown-linux-musleabihf
            qemu: qemu-arm-static
          - arch: i686
            triple: i686-unknown-linux-musl
            qemu: qemu-i386-static
          - arch: powerpc64le
            triple: powerpc64le-unknown-linux-musl
            qemu: qemu-ppc64le-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag names the workspace version, or the binary reports the
      # wrong release. v0.1.0-beta.11 published beta.10 bytes because the
      # manifest still read beta.10 (T-1423). No toolchain here: grep
      # and test refuse before one arch builds anything. A dispatch on a
      # branch refuses here too (T-1671): only a tag ref publishes.
      - name: the tag names the workspace version
        env:
          TRIAL: ${{ inputs.trial }}
        run: |
          # A trial run builds the branch head and publishes nothing, so a
          # release defect shows before release.yml creates a tag.
          if [ "$TRIAL" = true ]; then echo "nightly: trial on $GITHUB_REF_TYPE $GITHUB_REF_NAME"; exit 0; fi
          [ "$GITHUB_REF_TYPE" = tag ] || { echo "nightly: dispatch this workflow on a v* tag, not on the $GITHUB_REF_TYPE $GITHUB_REF_NAME" >&2; exit 1; }
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)"
          [ "$manifest" = "$tag" ] || { echo "nightly: tag v$tag does not match Cargo.toml version $manifest" >&2; exit 1; }

      # One path: the same script a session runs in a fresh container, with
      # only the components this job needs. The component list is what
      # podvm-gate check 19 holds this job to.
      - name: bootstrap
        run: ./scripts/common/bootstrap-env.sh rust bloat cc zig tools

      - name: rust target
        run: rustup target add ${{ matrix.triple }}

      # Before the binary, because the two objects are an input to it.
      # crates/podvm/build.rs embeds them; a binary built first embeds
      # two empty placeholders and this job passes with a podvm that
      # interposes nothing. The pair is the one of the leg's machine on
      # x86_64 and aarch64 (TODO/interpose.md T-1721); build.rs embeds an
      # object only where its ELF machine is the binary's, and on each
      # other arch the tier declines by name. The builder is the
      # podvm-interpose-build binary, built for the runner.
      - name: interposer, one object per libc
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release -p podvm-gate --bin podvm-interpose-build
          mkdir -p target/release
          cp target/x86_64-unknown-linux-musl/release/podvm-interpose-build target/release/
          if [ "${{ matrix.arch }}" = aarch64 ]; then
            rustup target add aarch64-unknown-linux-gnu aarch64-unknown-linux-musl
            TARGETS="aarch64-unknown-linux-gnu aarch64-unknown-linux-musl" ./target/release/podvm-interpose-build
          else
            ./target/release/podvm-interpose-build
          fi

      - name: build
        run: cargo build --release --target ${{ matrix.triple }}

      # The emulator each non-native binary is smoked under. Static binaries
      # need no sysroot: qemu-user runs them directly.
      - name: emulator
        if: matrix.qemu != ''
        run: |
          # Ubuntu 26.04 has qemu-user-static only as a virtual package;
          # qemu-user-binfmt provides it. Where only the plain name
          # (qemu-aarch64) exists, a link gives the matrix name.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-binfmt \
            || sudo apt-get install -y --no-install-recommends qemu-user-static
          q=${{ matrix.qemu }}
          if ! command -v "$q" >/dev/null 2>&1; then
            plain=$(command -v "${q%-static}") || { echo "no $q and no ${q%-static}" >&2; exit 1; }
            sudo ln -s "$plain" "/usr/local/bin/$q"
          fi
          "$q" --version | head -n 1

      # The per-arch smoke: version runs, the verbose document names this
      # triple, both interposer digests are present, crt-static reads yes,
      # and no PT_INTERP. TODO/packaging.md T-1329 extends it with a
      # loopback pull plus extract asserting payload bytes, so a binary
      # broken for its actual job cannot publish green. The smoke is the
      # podvm-smoke binary, built for the runner (it drives the per-arch
      # binary, it is not one).
      - name: smoke
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release -p podvm-gate --bin podvm-smoke
          mkdir -p target/release
          cp target/x86_64-unknown-linux-musl/release/podvm-smoke target/release/
          ./target/release/podvm-smoke target/${{ matrix.triple }}/release/podvm ${{ matrix.triple }} ${{ matrix.qemu }}

      - name: stage the asset
        run: |
          mkdir -p dist
          cp target/${{ matrix.triple }}/release/podvm dist/podvm-${{ matrix.arch }}
          (cd dist && sha256sum podvm-${{ matrix.arch }} > podvm-${{ matrix.arch }}.sha256)
          # TODO/packaging.md T-1565. The publish job has no Rust toolchain,
          # so the x86_64 leg couriers the musl-static release-notes binary
          # to it through its own artefact. The name stays outside the
          # dist/podvm-* release glob, so the published asset set is
          # unchanged and the signing loop skips it.
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            cp target/${{ matrix.triple }}/release/release-notes dist/release-notes-x86_64
          fi

      # TODO/packaging.md T-1737. The packager and the licence inventory are
      # built for the runner: they read the per-arch helpers, they are not
      # shipped.
      - name: smoke and package the SSH helpers
        run: |
          cargo build --release -p podvm-release --bin podvm-package-ssh
          cargo build --release -p podvm-buildstate --bin podvm-release-licenses
          ./target/x86_64-unknown-linux-musl/release/podvm-package-ssh target/${{ matrix.triple }}/release ${{ matrix.arch }} ${{ matrix.qemu }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: podvm-nightly-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish the nightly pre-release
    needs: build
    if: ${{ !inputs.trial }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      # `gh release create` shells out to git for the repository it runs in,
      # so this job checks out too. The first run of this workflow proved the
      # point: seven green legs and a publish that died on `not a git
      # repository` before creating anything.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: fetch every arch asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ github.run_id }} --repo ${{ github.repository }} --dir dist

      - name: lay out the release files
        run: |
          cd dist
          for d in podvm-nightly-*/; do mv "$d"* . && rmdir "$d"; done
          ls -l podvm-*

      # Keyless signing at publish, TODO/packaging.md T-1328. No
      # long-lived key to guard and rotate: the publish job's own OIDC
      # identity signs, and verification names the workflow identity.
      # `cosign bundle` per artefact (one blob, one bundle) because the
      # seven binaries are independent files, not one archive.
      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign the artefacts
        run: |
          cd dist
          for bin in podvm-*; do
            case "$bin" in
              *.sigstore | *.sha256) continue ;;
            esac
            cosign sign-blob --yes --bundle "$bin.sigstore" "$bin"
          done
          ls -l podvm-*

      # An existing release for this tag is re-uploaded rather than remade:
      # deleting and recreating a release to publish is a wider action than
      # replacing its files, and the files are this run's own.
      #
      # TODO/packaging.md T-1334. The notes carry the build commit's gate
      # state and the reproducibility boundary, computed here rather than
      # copied: the gate run is this workflow's own `gate` conclusion on
      # the tagged commit, and the boundary is T-1004's intra-host claim
      # with its condition stated. A `grep -c` over the notes finds both.
      # TODO/packaging.md T-1565. The notes step runs the musl-static
      # binary the x86_64 leg couriered through its artefact, not the
      # shim: this job has no toolchain to build it with.
      - name: release notes with gate state and boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x dist/release-notes-x86_64
          ./dist/release-notes-x86_64 "${{ github.ref_name }}" > release-notes.txt
          cat release-notes.txt
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber dist/podvm-*
          else
            gh release create "$tag" --title nightly --prerelease --notes-file release-notes.txt dist/podvm-*
          fi

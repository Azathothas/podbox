name: Bug
description: Something does not work.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What you did, what happened, what you expected
      description: >-
        All three. The third is the one usually missing, and it is the one that
        says whether this is a bug at all.
      placeholder: |
        What I did:
        What happened:
        What I expected:
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: >-
        The smallest sequence that shows it, with the image and its tag. If it
        is intermittent, say how often.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: podvm and the host
      description: >-
        Paste the output of these three commands. They name the build, the
        rung that podvm selects on your host, and what the host permits.
      placeholder: |
        podvm version --verbose
        podvm system info --format '{{.Version}} {{.Rung}} {{.EnteredRung}} {{.Platform}} {{.Kernel}}'
        podvm probe
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output of the failing command
      description: >-
        Run it again with `--verbose` (the banner names the mechanism) and, for
        `run`, with `--report report.json`, and paste both. Redact any
        credential before pasting. Check twice.
      render: text

[workspace]
resolver = "2"
members = [
    "crates/podvm",
    "crates/podvm-probe",
    "crates/podvm-image",
    "crates/podvm-extract",
    "crates/podvm-complete",
    "crates/podvm-enter",
    "crates/podvm-dispatch",
    "crates/podvm-gate",
    "crates/podvm-buildstate",
    "crates/podvm-release",
    "crates/podvm-measure",
    "crates/podvm-supervise",
    "crates/podvm-windows",
    "crates/podvm-ssh",
    "crates/podvm-todo",
    "crates/podvm-api",
]

# ⛔ podvm-interpose is NOT a workspace member. It is a cdylib that runs inside
# other people's processes, it must not depend on the rest of the tree
# (TOOL.md section 4.3, section 6.7), and it is built separately and embedded in the launcher
# as a byte array. A member would share this workspace's dependency unification
# and feature resolution, which is the coupling it exists to avoid.
exclude = ["crates/podvm-interpose"]

[workspace.package]
version = "0.2.0-beta.15"
edition = "2024"
rust-version = "1.99"
license = "0BSD"
repository = "https://github.com/PodUtils/podvm"

[workspace.dependencies]
# ⭐ THE SWEEP RAN. `TOOL.md` section 3.5 is a policy and not a shopping list,
# and until 2026-09-08 this block was empty because nothing had been measured.
# TODO/deps.md T-0901 to T-0910 are now closed against numbers taken by
# `experiments/110-bloat-delta.sh`, one area at a time, each with its scaffold
# and its `cargo bloat` breakdown committed under `experiments/results/`.
#
# ⛔ EVERY LINE BELOW IS A RULING WITH A MEASUREMENT UNDER IT, and the entry it
# closes is named beside it. A version pinned here is not an enabled
# dependency: a member crate takes it with `foo.workspace = true` when the
# milestone that needs it lands, so the artefact carries none of this today and
# `experiments/results/bloat-baseline.txt` is still the "before".
#
# ⛔ WHAT WAS MEASURED AND REFUSED is as much of the ruling as what was taken,
# and it is in the entries rather than here so a reader cannot take a
# commented-out line for a plan: `clap` and `goblin` (T-0908), `oci-spec`
# (T-0904), `seccompiler` (T-0902), the `landlock` crate (T-0903), `rustix` and
# `libc` (T-0901).
#
# ⚠ NO BYTE COUNT APPEARS BELOW, DELIBERATELY. A number written in two files
# drifts, and the copy a reader trusts is the wrong one: measured on 2026-09-08,
# one figure here was already stale against its entry within the hour, because
# the arm had been re-taken. Each pin names the entry that ruled it and the
# result file that holds the number, and both of those are checked by the gate.

# T-0905, `experiments/results/bloat-tls.txt`. The only transport that works.
# ⚠ `rustls` is pure Rust and its crypto provider is NOT: `ring` compiles C and
# assembly. `scripts/zig-cc.sh` and `.cargo/config.toml` are the answer, and
# the entry carries what that drags.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pki-types = "1"
# The host bundle first, because T-0407 needs it read anyway; the compiled-in
# roots are the fallback for a machine that has none. `pod-tls` (podcrates)
# holds the PEM reader and `webpki-roots`. `bloat-tls-hostroots.txt` is the
# same arm without the fallback, which is what prices it.

# T-0911's pins of `syscalls` and `linux-raw-sys` left with the syscall
# layer: it is `pod-hostprobe` of PodUtils/podcrates since T-1681, and that
# crate pins them.

# T-0907, `experiments/results/bloat-archive.txt`. ⛔ `rust_backend` is named
# rather than defaulted: flate2's default backend is C.
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# ⭐ `bloat-archive-zstd.txt` against `bloat-archive.txt` settles the entry's
# open question: zstd costs one page over the gzip pair, so a named refusal for
# a zstd layer saves nothing worth having.
ruzstd = "0.9"

# T-0908, `experiments/results/bloat-digest.txt` and `bloat-json.txt`. The four
# OCI types are structs here rather than `oci-spec`, which wanted three times
# the crates for them (T-0904).
sha2 = { version = "0.11", default-features = false }
xz4rust = { version = "0.2.3", default-features = false, features = ["std", "bcj", "crc64", "no_unsafe"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# TODO/cli.md T-1654: the profiles. podvm checks each key
# and each type itself, so that an error names the key.
toml = "1"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = "symbols"
panic = "abort"

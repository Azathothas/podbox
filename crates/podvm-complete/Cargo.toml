[package]
name = "podvm-complete"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The completion is `pod-rootfs` of PodUtils/podcrates (T-0401 to T-0415).
# This crate gives it podvm's names, flags and CA bundle, answers its mirror
# probe over the HTTP transport of `podvm-image` (`podvm_image::net`), and
# keeps podvm's banner and JSON. `podvm-probe` gives the settings of
# `pod-hostprobe`, so the space message names `$PODVM_STORE`.
[dependencies]
pod-rootfs = { git = "https://github.com/PodUtils/podcrates", tag = "v0.17.0" }
podvm-probe = { path = "../podvm-probe" }
podvm-image = { path = "../podvm-image" }
serde_json.workspace = true

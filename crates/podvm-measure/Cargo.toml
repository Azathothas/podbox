[package]
name = "podvm-measure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Machine-tier tooling as binaries. Behaviour-preserving ports of
# experiments/145-podvm-parity.sh (T-1568) and
# experiments/154-tcg-workload-spread.sh (T-1569): the scripts stay as
# compat shims that exec these binaries, and the binaries own the logic.
# Arguments are parsed by hand. JSON answers from the binary are parsed
# in-process; the scripts' `jq` is not needed. The one dependency is
# `pod-services`: the pinned image, the kernel archive and its SHA-256
# come from podcrates' list of other parties' hosts (TODO/deps.md T-1679).

[[bin]]
name = "podvm-parity"
path = "src/main.rs"

[[bin]]
name = "podvm-workload"
path = "src/workload.rs"

[dependencies]
pod-services = { git = "https://github.com/PodUtils/podcrates", tag = "v0.22.0" }

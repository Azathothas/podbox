[package]
name = "podvm-image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# ⛔ Every line here was ruled by a measured `cargo bloat` delta in
# TODO/deps.md and is pinned in `[workspace.dependencies]`. This is the first
# member to take any of them, so this file is where the sweep stops being
# inert.
podvm-probe = { path = "../podvm-probe" }
rustls.workspace = true
rustls-pki-types.workspace = true
# The roots, the PEM reader and the client configuration (`tls.rs`), shared
# with podssh and podnet through PodUtils/podcrates. The provider is podvm's
# `ring`.
pod-tls = { git = "https://github.com/PodUtils/podcrates", tag = "v0.38.0", default-features = false }
# The HTTP transport (`net.rs`): the registry, the token realm, the guest image
# fetch and the mirror probe, through the proxy of the environment. The
# feature `blocking` runs it on a private runtime of one thread, so podvm's own
# code stays synchronous. `pod-core` gives the stage of a failure.
pod-proxy = { git = "https://github.com/PodUtils/podcrates", tag = "v0.38.0", default-features = false, features = ["blocking"] }
pod-core = { git = "https://github.com/PodUtils/podcrates", tag = "v0.38.0", default-features = false }
# The space and exec checks of a directory (`space.rs`, `exec_probe.rs`),
# with podvm's settings from `podvm-probe`.
pod-hostprobe = { git = "https://github.com/PodUtils/podcrates", tag = "v0.38.0" }
# The OCI registry client: the reference, the digest, the documents, the
# platform, the logins, the registry API, the insecure policy, the roots,
# the resolve and the fetch pool. podvm gives its settings
# (`registry::client`, `transport::resolve`, `platform::wanted`,
# `credentials`) and keeps the store.
pod-oci = { git = "https://github.com/PodUtils/podcrates", tag = "v0.38.0" }
# The advisory lock of the store (`store::Lock`): the index lock, the image
# hold, the staging locks.
pod-supervise = { git = "https://github.com/PodUtils/podcrates", tag = "v0.38.0" }
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
# TODO/image.md T-1320: the save/load tarball, taken for its Builder and
# Archive file api. Already in the graph through podvm-extract at this
# version, so no new crate enters the tree.
tar.workspace = true

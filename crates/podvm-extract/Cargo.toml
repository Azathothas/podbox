[package]
name = "podvm-extract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
podvm-probe = { path = "../podvm-probe" }
podvm-image = { path = "../podvm-image" }
# The rootless apply of the layers (the order, the whiteouts, the
# containment, the ownership sidecar, the digest check while the blob is
# read), shared through PodUtils/podcrates. This crate gives podvm's store,
# its layout of the rootfs and its settings to it. `tar` is taken there for
# its entry API and never for `unpack()` (TODO/extract.md T-0301), with
# `flate2`'s Rust backend and `ruzstd`.
pod-extract = { git = "https://github.com/PodUtils/podcrates", tag = "v0.35.0" }
pod-core = { git = "https://github.com/PodUtils/podcrates", tag = "v0.35.0", default-features = false }
# TODO/image.md T-1709: the FICLONE of the container tree (`tree.rs`).
pod-hostprobe = { git = "https://github.com/PodUtils/podcrates", tag = "v0.35.0" }

[package]
name = "podvm-extract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# ⛔ EVERY PIN HERE WAS RULED BY A MEASURED `cargo bloat` DELTA in
# TODO/deps.md T-0907 and T-0908, and `experiments/110-bloat-delta.sh` is the
# instrument. `tar` is taken for its ENTRY-LEVEL api and never for `unpack()`,
# which is the whole of TODO/extract.md T-0301: `unpack()` makes the ownership,
# permission and path decisions this crate exists to make.
# ⚠ `flate2`'s default backend is C. `rust_backend` is named rather than
# defaulted, because a C backend complicates `crt-static` for no measured gain.
[dependencies]
podvm-probe = { path = "../podvm-probe" }
podvm-image = { path = "../podvm-image" }
tar.workspace = true
flate2.workspace = true
ruzstd.workspace = true
serde.workspace = true
serde_json.workspace = true
# ⭐ TODO/extract.md T-1315: the per-extract re-verification hashes each blob
# while it streams. `sha2` is already in the graph at this version (T-0908),
# so this adds no crate, only the use.
sha2.workspace = true

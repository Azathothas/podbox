[package]
name = "podvm-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The disposable guest: the boot plan on the machine tier's own profile, the
# overlay, the FAT16 mailbox, the cmd.exe and DOS agents, QMP, the bounded
# stop and the bounded store of a base image with its digest, shared through
# PodUtils/podcrates. This crate gives podvm's names and places to it, and
# keeps the base caches and docker's range of exit codes.
pod-guest = { git = "https://github.com/PodUtils/podcrates", tag = "v0.31.0" }

[package]
name = "podvm-supervise"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
podvm-probe = { path = "../podvm-probe" }
podvm-image = { path = "../podvm-image" }
podvm-enter = { path = "../podvm-enter" }
# TODO/image.md T-1709: `remove` takes the container's own tree with it.
podvm-extract = { path = "../podvm-extract" }
# The table, the launcher, the logs and the verbs of the lifecycle. This
# crate keeps podvm's settings, its record fields, the entry of a payload and
# the ownership memo.
pod-supervise = { git = "https://github.com/PodUtils/podcrates", tag = "v0.30.0" }
pod-core = { git = "https://github.com/PodUtils/podcrates", tag = "v0.30.0", default-features = false }
serde.workspace = true
serde_json.workspace = true

[package]
name = "podvm-ssh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# ⛔ One home for exit codes (TODO/cli.md T-0802): the runtime code is
# re-exported from `podvm-probe`, never re-declared here.
podvm-probe = { path = "../podvm-probe" }
# The relay legs: the client of `pod-relay` (PodUtils/podcrates) through its
# blocking facade, which owns a runtime on the current thread, so podvm's own
# code stays synchronous. It speaks `reverse-v1`: the relay's `hello` with
# `version` 1, the crate's dialect 1. `plain-ws` takes a stand-in relay on
# the loopback over plain `ws://`, as the tests and `ws://127.0.0.1` drives
# do; a host off the loopback stays refused. TLS for `wss://` is rustls with
# the trust anchors and the handshake of `pod-tls`; `pod-ws` gives the way
# out of each connection.
rustls.workspace = true
pod-relay = { git = "https://github.com/PodUtils/podcrates", tag = "v0.36.0", features = ["blocking", "plain-ws"] }
pod-ws = { git = "https://github.com/PodUtils/podcrates", tag = "v0.36.0" }
pod-tls = { git = "https://github.com/PodUtils/podcrates", tag = "v0.36.0", default-features = false }
# The proxy of a relay leg (`transport/egress.rs`): the rules of `HTTPS_PROXY`,
# `ALL_PROXY` and `NO_PROXY`, and the dial through an HTTP CONNECT or SOCKS5
# proxy, shared with podssh and podnet through PodUtils/podcrates. The
# blocking face runs on a private runtime of one thread; podvm's own code
# stays synchronous.
pod-proxy = { git = "https://github.com/PodUtils/podcrates", tag = "v0.36.0", default-features = false, features = ["blocking"] }
# The line discipline of a session with no pty (`session.rs`), shared with
# podssh through PodUtils/podcrates.
pod-term = { git = "https://github.com/PodUtils/podcrates", tag = "v0.36.0" }

[dev-dependencies]
# The fake relay of the tests reads and writes the relay's control frames.
serde_json.workspace = true

[package]
name = "podvm-ssh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# ⛔ One home for exit codes (TODO/cli.md T-0802): the runtime code is
# re-exported from `podvm-probe`, never re-declared here.
podvm-probe = { path = "../podvm-probe" }
# The relay legs: TLS for `wss://` (T-0905's rustls ruling), trust anchors
# with a host-bundle-first fallback, and JSON for the relay's TEXT control
# frames. The websocket framing itself is hand-rolled in `ws.rs`: the opcode
# travels with the frame, which no byte-pipe websocket API preserves.
rustls.workspace = true
rustls-pemfile.workspace = true
webpki-roots.workspace = true
serde_json.workspace = true
base64.workspace = true
# The line discipline of a session with no pty (`session.rs`), shared with
# podssh through PodUtils/podcrates.
pod-term = { git = "https://github.com/PodUtils/podcrates", tag = "v0.3.0" }

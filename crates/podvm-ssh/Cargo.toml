[package]
name = "podvm-ssh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# ⛔ One home for exit codes (TODO/cli.md T-0802): the runtime code is
# re-exported from `podvm-probe`, never re-declared here.
podvm-probe = { path = "../podvm-probe" }
# The relay legs: TLS for `wss://` (T-0905's rustls ruling) with the trust
# anchors and the handshake of `pod-tls`, and JSON for the relay's TEXT
# control frames. The websocket framing itself is hand-rolled in `ws.rs`: the opcode
# travels with the frame, which no byte-pipe websocket API preserves.
rustls.workspace = true
pod-tls = { git = "https://github.com/PodUtils/podcrates", tag = "v0.19.0", default-features = false }
# The proxy of a relay leg (`transport/egress.rs`): the rules of `HTTPS_PROXY`,
# `ALL_PROXY` and `NO_PROXY`, and the dial through an HTTP CONNECT or SOCKS5
# proxy, shared with podssh and podnet through PodUtils/podcrates. The
# blocking face runs on a private runtime of one thread; podvm's own code
# stays synchronous.
pod-proxy = { git = "https://github.com/PodUtils/podcrates", tag = "v0.19.0", default-features = false, features = ["blocking"] }
serde_json.workspace = true
base64.workspace = true
# The line discipline of a session with no pty (`session.rs`), shared with
# podssh through PodUtils/podcrates.
pod-term = { git = "https://github.com/PodUtils/podcrates", tag = "v0.19.0" }

[package]
name = "podvm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# ⛔ It only COPIES what `scripts/build-interpose.sh` left behind and never
# invokes cargo. `build.rs` carries the reason and the measurement behind it.
build = "build.rs"

[build-dependencies]
# The interposer digests `version --verbose` reports (T-1004). Same version
# the workspace already locks, so no new dependency enters the tree.
sha2.workspace = true

[[bin]]
name = "podvm"
path = "src/main.rs"

[dependencies]
# TODO/machine.md T-1718: the unified tarball of an incus image.
tar.workspace = true
# TODO/machine.md T-1656: the pinned guest kernel (a .tar.gz, by SHA-256).
flate2.workspace = true
xz4rust.workspace = true
sha2.workspace = true
podvm-probe = { path = "../podvm-probe" }
podvm-image = { path = "../podvm-image" }
serde_json.workspace = true
# TODO/cli.md T-1654: the TOML of a profile.
toml.workspace = true
podvm-extract = { path = "../podvm-extract" }
podvm-complete = { path = "../podvm-complete" }
podvm-enter = { path = "../podvm-enter" }
podvm-dispatch = { path = "../podvm-dispatch" }
# TODO/machine.md T-1727: the client of the incus REST API (T-1718), shared
# through PodUtils/podcrates; a runtime of one thread drives it.
pod-incus = { git = "https://github.com/PodUtils/podcrates", tag = "v0.44.0" }
pod-link = { git = "https://github.com/PodUtils/podcrates", tag = "v0.44.0" }
# TODO/deps.md T-1679: the hosts of other parties (the guest kernel's
# archive, the default server of login), one list in podcrates.
pod-services = { git = "https://github.com/PodUtils/podcrates", tag = "v0.44.0" }
# The offline part of a network lab: knobs, plan, verdicts (TODO/net.md T-1662).
pod-netlab = { git = "https://github.com/PodUtils/podcrates", tag = "v0.44.0" }
# TODO/net.md T-1665: the egress broker of `--net broker`, chained to the
# host's proxy through `pod-proxy`.
pod-broker = { git = "https://github.com/PodUtils/podcrates", tag = "v0.44.0" }
pod-proxy = { git = "https://github.com/PodUtils/podcrates", tag = "v0.44.0" }
pod-core = { git = "https://github.com/PodUtils/podcrates", tag = "v0.44.0", default-features = false, features = ["async"] }
tokio = { version = "1", default-features = false, features = ["rt", "fs", "net", "io-util", "time"] }
podvm-supervise = { path = "../podvm-supervise" }
# ⭐ TODO/milestones.md T-1112. The disposable Windows guest. Its own crate
# because the whole guest side is `cmd.exe` and a FAT mailbox and none of it
# shares a line with the OCI path.
podvm-windows = { path = "../podvm-windows" }

[dev-dependencies]
# TODO/cli.md T-1745: each flag that podvm-api writes has a row of the
# parity table, and a run through podvm-api reads its record.
podvm-api = { path = "../podvm-api" }

[package]
name = "podvm-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The probes, the raw system calls under them and the space and exec checks,
# shared through PodUtils/podcrates. This crate gives podvm's settings to it
# and keeps the report. The syscall table and the kernel's struct layouts
# (TODO/deps.md T-0911, T-0912) come with it.
pod-hostprobe = { git = "https://github.com/PodUtils/podcrates", tag = "v0.32.0" }
# TODO/enter.md T-1652: `measured_by.user_dispatch`, whether the
# native-static rung can arm on this host.
podvm-dispatch = { path = "../podvm-dispatch" }
